services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fieldreport
      POSTGRES_PASSWORD: fieldreport
      POSTGRES_DB: fieldreport
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldreport"]
      interval: 5s
      timeout: 5s
      retries: 5

  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      GOTENBERG_HOST: gotenberg
    depends_on:
      db:
        condition: service_healthy
      gotenberg:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "src.workers.template_analysis_worker"]
    env_file:
      - .env
    environment:
      GOTENBERG_HOST: gotenberg
    depends_on:
      db:
        condition: service_healthy
      gotenberg:
        condition: service_healthy

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    ports:
      - "10000:10000"
      - "10001:10001"
    volumes:
      - azurite_data:/data
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --skipApiVersionCheck

volumes:
  postgres_data:
  azurite_data:
