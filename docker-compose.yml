services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fieldreport
      POSTGRES_PASSWORD: fieldreport
      POSTGRES_DB: fieldreport
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldreport"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://fieldreport:fieldreport@db:5432/fieldreport
      APP_ENV: development
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
