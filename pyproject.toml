[project]
name = "fieldreport-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "bcrypt>=4.2.0",
    "fastapi>=0.115.0",
    "PyJWT>=2.10.0",
    "PyMuPDF>=1.26.0",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "openai>=2.36.0",
    "loguru>=0.7.0",
    "azure-storage-blob>=12.23.0",
    "aiohttp>=3.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-env>=1.1.5",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "ty>=0.0.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ty.environment]
python-version = "3.12"

[[tool.ty.overrides]]
include = ["src/config.py"]

[tool.ty.overrides.rules]
missing-argument = "ignore"
