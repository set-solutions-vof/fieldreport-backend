[pytest]
asyncio_mode = auto
testpaths =
    tests
addopts =
    --cov=src
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=100
env =
    APP_ENV=test
    DATABASE_URL=postgresql+asyncpg://fieldreport:fieldreport@localhost:5432/fieldreport_test
    JWT_SECRET_KEY=jwt-secret-for-tests-jwt-secret-for-tests
    JWT_ALGORITHM=HS256
    ACCESS_TOKEN_EXPIRE_MINUTES=15
    REFRESH_TOKEN_EXPIRE_DAYS=7
